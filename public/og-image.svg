<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Prompts for Mere Mortals</title>
  <desc id="desc">A colorful grimoire-style social preview for an opinionated AI coding prompt catalog.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b065e"/>
      <stop offset="0.48" stop-color="#4d1499"/>
      <stop offset="1" stop-color="#1d063d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="60%">
      <stop offset="0" stop-color="#ffd64f" stop-opacity="0.45"/>
      <stop offset="0.48" stop-color="#f444a7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#12051f"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="#fff3c4" opacity="0.95">
    <circle cx="92" cy="96" r="5"/>
    <circle cx="188" cy="500" r="4"/>
    <circle cx="1040" cy="112" r="5"/>
    <circle cx="1088" cy="502" r="4"/>
    <circle cx="764" cy="78" r="3"/>
    <circle cx="692" cy="540" r="4"/>
  </g>
  <g fill="#ffc52d">
    <path d="M156 150c8 29 20 41 49 49-29 8-41 20-49 49-8-29-20-41-49-49 29-8 41-20 49-49z"/>
    <path d="M1000 352c6 22 15 31 37 37-22 6-31 15-37 37-6-22-15-31-37-37 22-6 31-15 37-37z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="86" width="1016" height="448" rx="32" fill="#fff0b8" stroke="#12051f" stroke-width="8"/>
    <path d="M92 412h1016v86c0 20-16 36-36 36H128c-20 0-36-16-36-36z" fill="#17d0a4" stroke="#12051f" stroke-width="8"/>
  </g>

  <g transform="translate(140 135)">
    <rect x="0" y="0" width="168" height="168" rx="84" fill="#f444a7" stroke="#12051f" stroke-width="8"/>
    <path d="M84 37c5 26 16 37 42 42-26 5-37 16-42 42-5-26-16-37-42-42 26-5 37-16 42-42z" fill="#ffc52d" stroke="#12051f" stroke-width="5"/>
  </g>

  <text x="360" y="170" fill="#12051f" font-family="Georgia, serif" font-size="84" font-weight="900">Prompts</text>
  <text x="360" y="250" fill="#12051f" font-family="Georgia, serif" font-size="72" font-weight="900">for Mere Mortals</text>
  <text x="360" y="322" fill="#12051f" font-family="Arial, sans-serif" font-size="32" font-weight="800">Opinionated AI coding prompts for</text>
  <text x="360" y="370" fill="#12051f" font-family="Arial, sans-serif" font-size="36" font-weight="900">Kilo, Codex, Claude, and friends.</text>

  <g transform="translate(360 438)">
    <rect x="0" y="0" width="192" height="56" rx="14" fill="#ffc52d" stroke="#12051f" stroke-width="5"/>
    <text x="28" y="37" fill="#12051f" font-family="Arial, sans-serif" font-size="22" font-weight="900">Copy a scroll</text>
    <rect x="218" y="0" width="172" height="56" rx="14" fill="#b6ee34" stroke="#12051f" stroke-width="5"/>
    <text x="246" y="37" fill="#12051f" font-family="Arial, sans-serif" font-size="22" font-weight="900">Build faster</text>
  </g>
</svg>
